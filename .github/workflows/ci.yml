name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install (lockfile if present)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Unit + integration suite
        timeout-minutes: 5
        # Outer shell timeout: individual test files must also process.exit so open handles cannot pin npm.
        run: timeout 90s npm test
