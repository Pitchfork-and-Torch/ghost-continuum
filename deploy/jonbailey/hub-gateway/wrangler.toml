# Ghost Continuum Hub API gateway - ghost.jonbailey.xyz/api/*
# The dashboard is served by the local hub behind this gateway.
# HUB_ORIGIN is the existing tunnel to that hub. Do not create a Pages project for the hub UI.

name = "jonbailey-ghost-hub-api"
main = "worker.js"
compatibility_date = "2024-09-01"

routes = [
  { pattern = "ghost.jonbailey.xyz/api/*", zone_name = "jonbailey.xyz" },
  { pattern = "ghost.jonbailey.xyz/taxii2/*", zone_name = "jonbailey.xyz" },
]

# Existing workers.dev gateway stays on. Wrangler disables it when routes
# are set and workers_dev is omitted.
workers_dev = true
preview_urls = true

[vars]
ALLOWED_ORIGIN = "https://ghost.jonbailey.xyz"
# Set via wrangler secret: HUB_ORIGIN
# Set via wrangler secret: HUB_TOKEN
# Set via wrangler secret when the hub is behind Access:
# CF_ACCESS_CLIENT_ID
# CF_ACCESS_CLIENT_SECRET